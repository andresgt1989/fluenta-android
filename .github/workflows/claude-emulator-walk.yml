name: Claude Emulator Walk

# Arranca un emulador Android REAL en la nube de GitHub, instala Fluenta,
# arranca de cero (sin idioma guardado), NAVEGA el flujo real y graba
# VIDEO + capturas de cada pantalla. Sube todo como artifacts.
#   - El video (.mp4) lo ves TÚ.
#   - Las capturas (.png) + el árbol de UI (.xml) los leo YO para auditar/arreglar.

on:
  workflow_dispatch:        # disparo manual (botón o API)

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator walk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -x
            mkdir -p artifacts
            PKG=com.alturya.fluenta
            APK=app/build/outputs/apk/debug/app-debug.apk

            adb install -r "$APK"
            adb shell pm clear $PKG || true

            # Empieza a grabar video en el dispositivo (en background)
            adb shell screenrecord --time-limit 120 /sdcard/walk.mp4 &
            REC_PID=$!

            # Lanza la app
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1
            sleep 6

            # Walk: en cada paso captura pantalla + árbol de UI, y toca el primer
            # botón "de avanzar" (Empezar/Continuar/Siguiente/Probar/→) si existe.
            for i in $(seq -w 1 10); do
              adb exec-out screencap -p > artifacts/step_${i}.png
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
              adb pull /sdcard/ui.xml artifacts/step_${i}.xml >/dev/null 2>&1 || true

              # Busca un botón de avanzar por texto y saca sus coordenadas centro
              COORDS=$(python3 - artifacts/step_${i}.xml <<'PY'
import sys, re
try:
    xml = open(sys.argv[1], encoding='utf-8', errors='ignore').read()
except Exception:
    sys.exit(0)
pat = re.compile(r'text="([^"]*)"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"')
wants = ['empezar gratis','empezar','continuar','siguiente','probar','listo','empezar el test','¡listo','elegir idioma','hacer el test']
best=None
for m in pat.finditer(xml):
    t=m.group(1).strip().lower()
    if any(w in t for w in wants):
        x=(int(m.group(2))+int(m.group(4)))//2
        y=(int(m.group(3))+int(m.group(5)))//2
        best=(x,y); break
if best: print(f"{best[0]} {best[1]}")
PY
)
              if [ -n "$COORDS" ]; then
                echo "step ${i}: tap $COORDS"
                adb shell input tap $COORDS
              else
                echo "step ${i}: sin boton de avanzar, scroll"
                adb shell input swipe 540 1600 540 700 300
              fi
              sleep 4
            done

            # Detiene la grabación y la baja
            wait $REC_PID 2>/dev/null || true
            sleep 2
            adb pull /sdcard/walk.mp4 artifacts/walk.mp4 || true

            # Logs por si hubo crashes
            adb logcat -d -t 2000 > artifacts/logcat.txt 2>/dev/null || true
            ls -la artifacts

      - name: Upload walk artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluenta-walk-${{ github.run_number }}
          path: app/artifacts/**
          retention-days: 14
