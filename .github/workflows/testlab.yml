name: Firebase Test Lab (Robo)

# Red de seguridad automatizada: en cada push, compila el APK y corre un Robo test
# en un DISPOSITIVO REAL en la nube de Google. Graba video + capturas + logcat.
# Así el sistema prueba la app real solo, sin que nadie lo pida.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT }}

      - name: Run Robo test on real device
        run: |
          set -o pipefail
          if gcloud firebase test android run \
            --type robo \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --device model=MediumPhone.arm,version=34,locale=es,orientation=portrait \
            --timeout 120s \
            --results-dir "ci-${{ github.run_number }}" \
            --record-video 2>&1 | tee /tmp/robo.log; then
            echo "Robo OK en dispositivo real."
          else
            # Cuota diaria de Test Lab agotada NO debe bloquear el merge: el gate duro
            # es build + tests dirigidos (Robolectric). El robo es best-effort.
            if grep -q "TEST_QUOTA_EXCEEDED" /tmp/robo.log; then
              echo "::warning::Test Lab quota agotada — robo omitido (no bloquea). Gate duro = build + tests dirigidos."
              exit 0
            fi
            echo "::error::Robo falló por una razón REAL (no cuota)."
            exit 1
          fi
